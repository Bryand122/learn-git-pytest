name: Deploy date invitation to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/romantic-date-invitation-app-g7px9a
    paths:
      - "date-invitation/**"
      - ".github/workflows/deploy-date-invitation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: date-invitation/package-lock.json

      - name: Install dependencies
        working-directory: date-invitation
        run: npm ci

      - name: Build static export
        working-directory: date-invitation
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Publishes date-invitation/out to the gh-pages branch, which GitHub
      # serves at https://bryand122.github.io/learn-git-pytest/
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: date-invitation/out
          commit_message: "Deploy date invitation app"
