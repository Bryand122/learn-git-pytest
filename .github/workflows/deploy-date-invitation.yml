name: Deploy date invitation to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/romantic-date-invitation-app-g7px9a
    paths:
      - "date-invitation/**"
      - ".github/workflows/deploy-date-invitation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: date-invitation/package-lock.json

      - name: Install dependencies
        working-directory: date-invitation
        run: npm ci

      - name: Build static export
        working-directory: date-invitation
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: date-invitation/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
